services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped

    ports:
      - "${MB_PORT:-3000}:3000"

    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PASSWORD_COMPLEXITY: normal
      MB_PASSWORD_LENGTH: 8

    volumes:
      - metabase_data:/metabase-data

    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  metabase_data: