version: 2

sources:
  - name: xeno_raw
    database: XENO_DB
    schema: RAW
    description: "Camada raw: dado carregado direto do S3 via Stage do Snowflake."
    tables:
      - name: users
        description: "Tabela de usuários (já existente no schema RAW)."

      - name: src_recording_features
        description: >
          Camada silver: uma linha por gravação, já com metadados
          (nome popular, país, localização, qualidade, url, data, tipo
          de vocalização) e features acústicas (MFCCs, RMS, ZCR,
          spectral centroid/bandwidth) extraídas via librosa, tudo no
          mesmo arquivo. Carregada via COPY INTO MATCH_BY_COLUMN_NAME
          a partir do stage @XENO_DB.RAW.S3_STAGE_SILVER
          (arquivos <recording_id>.parquet em s3://xeno-canto-s3/silver/).
        columns:
          - name: id
            description: "ID da gravação."
            tests:
              - not_null
              - unique
