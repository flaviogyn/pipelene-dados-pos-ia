name: 'pipelene_dbt'
version: '1.0.0'
config-version: 2

# Link to the profile defined in profiles.yml
profile: 'pipelene_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Espécie-alvo do classificador binário (target vs. all).
# Usada em dim_species.sql e fct_recordings.sql.
vars:
  target_genus: 'Pitangus'
  target_species: 'sulphuratus'

models:
  pipelene_dbt:
    staging:
      +materialized: view   # staging vira VIEW (leve, sempre lê o dado atual)
      +schema: staging
    marts:
      +materialized: table  # marts (gold) viram TABLE (materializada, rápida pro Metabase)
      +schema: gold          # <-- corrigido: era 'XENO_DB' (nome do database, não schema)
